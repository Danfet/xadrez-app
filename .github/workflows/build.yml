name: Compilar APK Automático

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3-pip build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev liblzma-dev \
            libsqlite3-dev libssl-dev libffi-dev libbz2-dev openjdk-17-jdk unzip zip

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Executar Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: xadrez-apk
          path: bin/*.apk
