name: Compilar APK Kivy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Puxar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev m4
          pip3 install --user --upgrade "Cython==0.29.33" virtualenv setuptools wheel
          pip3 install --user buildozer

      - name: Configurar o Buildozer corretamente
        run: |
          export PATH=$PATH:~/.local/bin
          yes | buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,chess,charset-normalizer,requests/' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/title = My Application/title = Xadrez/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = xadrez/' buildozer.spec
          sed -i 's/#android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/#icon.filename = %(source.dir)s\/data\/icon.png/icon.filename = %(source.dir)s\/icone.png/' buildozer.spec
          sed -i 's/#?\s*android\.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/#?\s*log_level = \d/log_level = 2/' buildozer.spec

      - name: Compilar o APK e capturar log
        run: |
          export PATH=$PATH:~/.local/bin
          yes | buildozer -v android debug > build_log.txt 2>&1 || true

      - name: Guardar log completo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Log-De-Erro-Build
          path: build_log.txt

      - name: Disponibilizar o APK (se gerado)
        uses: actions/upload-artifact@v4
        with:
          name: Xadrez-Kivy-APK
          path: bin/*.apk
